# Simple example servers for distinct ports (site1/site2)
server {
    listen 127.0.0.1:8083;
    server_name site1.local www.site1.local;
    root ./www/site1;
    index index.html;

    location / {
        root ./www/site1;
        index index.html;
        allow_methods GET;
        autoindex off;
    }
}

server {
    listen 127.0.0.1:8084;
    server_name site2.local www.site2.local;
    root ./www/site2;
    index index.html;

    location / {
        root ./www/site2;
        index index.html;
        allow_methods GET;
        autoindex off;
    }
}

