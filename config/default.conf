# Webserv Default Configuration File
# This configuration demonstrates various features of the webserver

server {
    listen 127.0.0.1:8080;
    server_name localhost webserv.local;
    root ./www;
    index index.html;
    client_max_body_size 200M;
    
    # Error pages (use URIs so server resolves them using the server `root`)
    error_page 404 /error_pages/404.html;
    error_page 500 /error_pages/500.html;
    
    # Default location
    location / {
        root ./www;
        index index.html;
        allow_methods GET POST DELETE;
        cgi_extension sh;
        autoindex off;
    }
    
    # Static files location
    location /static {
        root ./www/static;
        allow_methods GET;
        autoindex off;
    }
    
    # Upload location
    location /upload {
        root ./www;
        allow_methods GET POST;
        upload_path ./www/uploads;
        autoindex off;
    }
    
    # CGI location for PHP scripts
    location /cgi-bin {
        root ./www/cgi-bin;
        allow_methods GET POST;
        cgi_path /usr/bin/php-cgi;
        cgi_extension php;
    }

    # Temporary test CGI location for shell scripts (used by diagnostics)
    location /testcgi {
        root ./www;
        allow_methods GET POST;
        # use /bin/sh to execute .bla scripts (our blocking test script uses /bin/sh shebang)
        cgi_path /bin/sh;
        cgi_extension bla;
        autoindex off;
    }
    
    # Redirect example
    location /redirect {
        return http://www.example.com/;
    }

    # Test redirect: honor configured status code (301)
    location /old {
        return 301 /redirect.html;
    }

    # POST body test - max body 100 bytes, accepts POST
    location /post_body {
        root ./www;
        allow_methods POST GET;
        client_max_body_size 100;
        autoindex off;
    }

    # Demo location for sample pages / tests
    location /demo {
        root ./www/demo;
        allow_methods GET POST DELETE;
        autoindex off;
        upload_path ./www/demo;
    }

    # Enable directory listing for testing
    location /testdir {
        # Map this location to the specific directory so autoindex lists
        # the `www/testdir` folder contents instead of the server root.
        root ./www/testdir;
        allow_methods GET;
        autoindex on;
    }

    location /private {
        root ./www;
        deny all;
    }

    # Serve configured error pages under /error_pages
    location /error_pages {
        root ./www/error_pages;
        allow_methods GET;
        autoindex off;
    }


}

# Additional server block for different port
server {
    listen 127.0.0.1:8081;
    server_name test.local;
    root ./www;
    index index.html;
    client_max_body_size 5M;
    
    location / {
        root ./www;
        index index.html;
        allow_methods GET POST;
        autoindex off;
    }
    
    # CGI location for Python scripts
    location /cgi-bin {
        root ./www/cgi-bin;
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_extension py;
        autoindex off;
    }
}

# Extra server block: listen on 127.0.0.1:8082 for alternate testing
server {
    listen 127.0.0.1:8082;
    server_name alt.local;
    root ./www;
    index index.html;
    client_max_body_size 2M;

    location / {
        root ./www;
        index index.html;
        allow_methods GET POST;
        autoindex off;
    }

    # CGI location (reuse same cgi-bin but allow different extension mapping if needed)
    location /cgi-bin {
        root ./www/cgi-bin;
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_extension py;
        autoindex off;
    }
}

