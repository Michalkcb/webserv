# Example vhosts configuration for webserv
# - Two server blocks listening on the same port (8080)
# - Requests are routed by the Host header to the matching server_name

server {
    listen 8080;
    server_name example.com www.example.com;
    root ./www/example_com;
    index index.html;
    # default location
}

server {
    listen 8080;
    server_name example.org www.example.org;
    root ./www/example_org;
    index index.html;
}

server {
    listen 8080;
    server_name test.com www.test.com;
    root ./www/test_com;
    index index.html;
}

# Optional: you can also configure a default server for the port by
# placing it first in the file. Requests without a Host header will
# be routed to the first server listening on the port.
