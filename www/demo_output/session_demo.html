<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Session demo</title>
  <link rel="stylesheet" href="/static/google-style.css">
</head>
<body>
  <div class="top-right"><a class="btn secondary" href="/">home</a></div>
  <h2>Session demo</h2>
  <p>Use the <b>Login</b> button to POST to <code>/cgi-bin/login.py</code> (it will set the SESSIONID cookie), then click <b>Check</b> to call <code>/session/get</code> and view JSON.</p>
  <button id="doLogin">Login (POST → /cgi-bin/login.py)</button>
  <button id="check">Check /session/get</button>
  <pre id="out">Output will appear here...</pre>

<script>
const out = s => document.getElementById('out').textContent = s;
document.getElementById('doLogin').onclick = async () => {
  const fd = new FormData();
  fd.append('username','admin'); fd.append('password','secret');
    try{
    const res = await fetch('/cgi-bin/login.py', { method:'POST', body: fd, credentials: 'same-origin' });
    out('Login status: ' + res.status + '\n\nNow click Check');
  }catch(e){ out('Login error: '+e); }
};
document.getElementById('check').onclick = async () => {
  try{
    const res = await fetch('/session/get', { credentials: 'same-origin' });
    const text = await res.text();
    out('GET /session/get — status: ' + res.status + '\n\n' + text);
  }catch(e){ out('Error checking session: '+e); }
};
</script>
</body>
</html>
