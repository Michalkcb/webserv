<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Session demo</title>
  <style> body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; } button{ margin:5px; } pre{ background:#f4f4f4; padding:10px; }</style>
</head>
<body>
  <h2>Session demo</h2>
  <p>Użyj przycisku <b>Login</b> aby wykonać POST do <code>/cgi-bin/login.py</code> (ustawi cookie SESSIONID), a potem <b>Check</b> aby wywołać <code>/session/get</code> i zobaczyć JSON.</p>
  <button id="doLogin">Login (POST → /cgi-bin/login.py)</button>
  <button id="check">Check /session/get</button>
  <pre id="out">Wyjście pojawi się tutaj...</pre>

<script>
const out = s => document.getElementById('out').textContent = s;
document.getElementById('doLogin').onclick = async () => {
  const fd = new FormData();
  fd.append('username','admin'); fd.append('password','secret');
  try{
    const res = await fetch('/cgi-bin/login.py', { method:'POST', body: fd, credentials: 'same-origin' });
    out('Login status: ' + res.status + '\n\nTeraz kliknij Check');
  }catch(e){ out('Błąd podczas login: '+e); }
};
document.getElementById('check').onclick = async () => {
  try{
    const res = await fetch('/session/get', { credentials: 'same-origin' });
    const text = await res.text();
    out('GET /session/get — status: ' + res.status + '\n\n' + text);
  }catch(e){ out('Błąd podczas sprawdzania sesji: '+e); }
};
</script>
</body>
</html>
