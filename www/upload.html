<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload file</title>
  <link rel="stylesheet" href="/static/google-style.css">
  </head>
<body>
  <div class="top-right"><a class="btn secondary" href="/">home</a></div>
  <h1>Upload File</h1>
  <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
    <label>
      Choose file:
      <input type="file" name="file" id="fileInput">
    </label>
    <br><br>
    <button type="submit">Upload</button>
  </form>

  <div class="progress hidden" id="progress"><div></div></div>
  <div id="result">
    <p id="summary"></p>
  <pre id="requestInfo" class="http-body hidden"></pre>
  <pre id="serverResponse" class="http-body hidden"></pre>
  <div id="uploadsList" class="uploads-list hidden">
      <h3>Uploads folder</h3>
      <ul id="uploadsItems"></ul>
    </div>
  </div>

<script>
function formatBytes(n) {
  if (n === 0) return '0 B';
  var k = 1024, sizes = ['B','KB','MB','GB','TB'];
  var i = Math.floor(Math.log(n) / Math.log(k));
  return (n / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
}

function showRequestInfo(file) {
  var el = document.getElementById('requestInfo');
  var lines = [];
  lines.push('Request: POST /upload');
  lines.push('Filename: ' + file.name);
  lines.push('Type: ' + (file.type || 'unknown'));
  lines.push('Size: ' + file.size + ' bytes (' + formatBytes(file.size) + ')');
  el.textContent = lines.join('\n');
  el.style.display = 'block';
}

function showServerResponse(status, body) {
  var el = document.getElementById('serverResponse');
  el.textContent = 'HTTP ' + status + '\n\n' + body;
  el.style.display = 'block';
}

function renderUploadsList(files) {
  var wrap = document.getElementById('uploadsList');
  var ul = document.getElementById('uploadsItems');
  ul.innerHTML = '';
  if (!files || files.length === 0) {
    ul.innerHTML = '<li>(no files)</li>';
  } else {
    files.forEach(function(f){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '/uploads/' + encodeURIComponent(f);
      a.textContent = f;
      li.appendChild(a);
      ul.appendChild(li);
    });
  }
  wrap.style.display = 'block';
}

function fetchUploadsIndex() {
  // Try JSON index first
  return fetch('/uploads/uploads.json', {cache: 'no-store'}).then(function(res){
    if (!res.ok) throw new Error('no json');
    return res.json();
  }).catch(function(){
    // Fallback: fetch directory listing HTML and parse links
    return fetch('/uploads/', {cache: 'no-store'}).then(function(res){
      if (!res.ok) throw new Error('no listing');
      return res.text().then(function(html){
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var anchors = doc.querySelectorAll('a');
        var files = [];
        anchors.forEach(function(a){
          var href = a.getAttribute('href');
          if (!href) return;
          // skip parent dirs
          if (href === '../' || href === '/') return;
          // strip trailing slash
          var name = href.replace(/\/$/, '');
          // ignore directories
          if (name.indexOf('/') !== -1 && name.substr(-1) === '/') return;
          // ignore links that are just query strings
          if (name.length > 0) files.push(decodeURIComponent(name));
        });
        return files;
      });
    });
  });
}

document.getElementById('uploadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var input = document.getElementById('fileInput');
  if (!input.files || input.files.length === 0) {
    alert('Select a file first');
    return;
  }
  var file = input.files[0];
  showRequestInfo(file);

  var fd = new FormData();
  fd.append('file', file);

  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload', true);

  var progressBar = document.getElementById('progress');
  var progressInner = progressBar.querySelector('div');
  progressBar.style.display = 'none';
  document.getElementById('summary').textContent = '';
  document.getElementById('serverResponse').style.display = 'none';
  document.getElementById('uploadsList').style.display = 'none';

  xhr.upload.onprogress = function(evt) {
    if (evt.lengthComputable) {
      var pct = Math.round(evt.loaded / evt.total * 100);
      progressBar.style.display = 'block';
      progressInner.style.width = pct + '%';
    }
  };
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      document.getElementById('summary').textContent = 'Upload OK: ' + xhr.status + ' — server replied:';
      showServerResponse(xhr.status, xhr.responseText);
      // fetch uploads list and render
      fetchUploadsIndex().then(function(files){
        // if JSON returned an object with files array, handle both shapes
        if (files && files.files) files = files.files;
        renderUploadsList(files || []);
      }).catch(function(err){
        // on error, show a small note
        var wrap = document.getElementById('uploadsList');
        wrap.style.display = 'block';
        document.getElementById('uploadsItems').innerHTML = '<li>Could not read uploads folder: ' + err.message + '</li>';
      });
    } else {
      document.getElementById('summary').textContent = 'Upload failed: ' + xhr.status + ' — server replied:';
      showServerResponse(xhr.status, xhr.responseText);
    }
    progressInner.style.width = '0%';
    progressBar.style.display = 'none';
  };
  xhr.onerror = function() {
    document.getElementById('summary').textContent = 'Upload error';
    progressInner.style.width = '0%';
    progressBar.style.display = 'none';
  };

  xhr.send(fd);
});
</script>
</body>
</html>
